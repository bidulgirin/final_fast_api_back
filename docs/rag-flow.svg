<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <style>
      .box { fill: #ffffff; stroke: #1f2937; stroke-width: 2; rx: 10; ry: 10; }
      .title { font: 700 18px "Segoe UI", Arial, sans-serif; fill: #111827; }
      .label { font: 14px "Segoe UI", Arial, sans-serif; fill: #111827; }
      .lane { font: 700 14px "Segoe UI", Arial, sans-serif; fill: #1f2937; }
      .arrow { stroke: #1f2937; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .note { font: 12px "Segoe UI", Arial, sans-serif; fill: #4b5563; }
      .bg { fill: #f3f4f6; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1f2937" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="800" />

  <!-- Title -->
  <text class="title" x="30" y="40">RAG Flow (FAISS)</text>
  <text class="note" x="30" y="62">FAISS retrieves candidates quickly; DB or scoring logic refines results.</text>

  <!-- Shared entry -->
  <rect class="box" x="480" y="90" width="240" height="50" />
  <text class="label" x="600" y="120" text-anchor="middle">Client Request</text>

  <rect class="box" x="480" y="170" width="240" height="50" />
  <text class="label" x="600" y="200" text-anchor="middle">Select RAG Path</text>

  <path class="arrow" d="M600 140 L600 170" />

  <!-- Lanes -->
  <text class="lane" x="140" y="250">Phishing Docs</text>
  <text class="lane" x="520" y="250">Keyword RAG</text>
  <text class="lane" x="900" y="250">Chat / Guide</text>

  <!-- Phishing Docs flow -->
  <rect class="box" x="80" y="270" width="240" height="50" />
  <text class="label" x="200" y="300" text-anchor="middle">Docs Search</text>

  <rect class="box" x="80" y="350" width="240" height="50" />
  <text class="label" x="200" y="380" text-anchor="middle">FAISS: case docs index</text>

  <rect class="box" x="80" y="430" width="240" height="50" />
  <text class="label" x="200" y="460" text-anchor="middle">Top-k IDs + scores</text>

  <rect class="box" x="80" y="510" width="240" height="50" />
  <text class="label" x="200" y="540" text-anchor="middle">DB fetch by IDs</text>

  <rect class="box" x="80" y="590" width="240" height="50" />
  <text class="label" x="200" y="620" text-anchor="middle">API response</text>

  <!-- Keyword RAG flow -->
  <rect class="box" x="480" y="270" width="240" height="50" />
  <text class="label" x="600" y="300" text-anchor="middle">Sentence Input</text>

  <rect class="box" x="480" y="350" width="240" height="50" />
  <text class="label" x="600" y="380" text-anchor="middle">FAISS: keyword index</text>

  <rect class="box" x="480" y="430" width="240" height="50" />
  <text class="label" x="600" y="460" text-anchor="middle">Keyword hits</text>

  <rect class="box" x="480" y="510" width="240" height="50" />
  <text class="label" x="600" y="540" text-anchor="middle">AE/BERT scoring + boost</text>

  <rect class="box" x="480" y="590" width="240" height="50" />
  <text class="label" x="600" y="620" text-anchor="middle">Detection result</text>

  <!-- Chat/Guide flow -->
  <rect class="box" x="880" y="270" width="240" height="50" />
  <text class="label" x="1000" y="300" text-anchor="middle">Chat/Guide Query</text>

  <rect class="box" x="880" y="350" width="240" height="50" />
  <text class="label" x="1000" y="380" text-anchor="middle">FAISS: chat/guide index</text>

  <rect class="box" x="880" y="430" width="240" height="50" />
  <text class="label" x="1000" y="460" text-anchor="middle">Overfetch candidates</text>

  <rect class="box" x="880" y="510" width="240" height="50" />
  <text class="label" x="1000" y="540" text-anchor="middle">Post-filter (category/min)</text>

  <rect class="box" x="880" y="590" width="240" height="50" />
  <text class="label" x="1000" y="620" text-anchor="middle">Matched cases/guides</text>

  <!-- Branch arrows from select -->
  <path class="arrow" d="M600 220 L200 270" />
  <path class="arrow" d="M600 220 L600 270" />
  <path class="arrow" d="M600 220 L1000 270" />

  <!-- Vertical arrows for each lane -->
  <path class="arrow" d="M200 320 L200 350" />
  <path class="arrow" d="M200 400 L200 430" />
  <path class="arrow" d="M200 480 L200 510" />
  <path class="arrow" d="M200 560 L200 590" />

  <path class="arrow" d="M600 320 L600 350" />
  <path class="arrow" d="M600 400 L600 430" />
  <path class="arrow" d="M600 480 L600 510" />
  <path class="arrow" d="M600 560 L600 590" />

  <path class="arrow" d="M1000 320 L1000 350" />
  <path class="arrow" d="M1000 400 L1000 430" />
  <path class="arrow" d="M1000 480 L1000 510" />
  <path class="arrow" d="M1000 560 L1000 590" />
</svg>
