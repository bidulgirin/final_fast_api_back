<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <style>
      .box { fill: #ffffff; stroke: #1f2937; stroke-width: 2; rx: 10; ry: 10; }
      .title { font: 700 16px "Segoe UI", Arial, sans-serif; fill: #111827; }
      .col { font: 13px "Segoe UI", Arial, sans-serif; fill: #111827; }
      .note { font: 12px "Segoe UI", Arial, sans-serif; fill: #4b5563; }
      .bg { fill: #f8fafc; }
      .arrow { stroke: #1f2937; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1f2937" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="900" />
  <text class="title" x="30" y="40">Database ERD (core tables)</text>
  <text class="note" x="30" y="60">Source: app/db/models/*.py</text>

  <!-- users -->
  <rect class="box" x="40" y="100" width="340" height="250" />
  <text class="title" x="60" y="130">users</text>
  <text class="col" x="60" y="155">PK id (UUID)</text>
  <text class="col" x="60" y="175">google_sub (unique, nullable)</text>
  <text class="col" x="60" y="195">email (unique)</text>
  <text class="col" x="60" y="215">password_hash (nullable)</text>
  <text class="col" x="60" y="235">is_verified</text>
  <text class="col" x="60" y="255">name (nullable)</text>
  <text class="col" x="60" y="275">picture (nullable)</text>
  <text class="col" x="60" y="295">nickname (nullable)</text>
  <text class="col" x="60" y="315">created_at, updated_at</text>

  <!-- conversations -->
  <rect class="box" x="500" y="100" width="300" height="120" />
  <text class="title" x="520" y="130">conversations</text>
  <text class="col" x="520" y="155">PK id (String)</text>
  <text class="col" x="520" y="175">created_at</text>

  <!-- messages -->
  <rect class="box" x="900" y="100" width="300" height="170" />
  <text class="title" x="920" y="130">messages</text>
  <text class="col" x="920" y="155">PK id (int)</text>
  <text class="col" x="920" y="175">FK conversation_id</text>
  <text class="col" x="920" y="195">role</text>
  <text class="col" x="920" y="215">content</text>
  <text class="col" x="920" y="235">created_at</text>

  <!-- relationship arrow -->
  <path class="arrow" d="M800 160 L900 160" />
  <text class="note" x="835" y="150">1:N</text>

  <!-- phising_case_docs -->
  <rect class="box" x="40" y="420" width="420" height="210" />
  <text class="title" x="60" y="450">phising_case_docs</text>
  <text class="col" x="60" y="475">PK id (int)</text>
  <text class="col" x="60" y="495">file_id</text>
  <text class="col" x="60" y="515">interval</text>
  <text class="col" x="60" y="535">case_name</text>
  <text class="col" x="60" y="555">text</text>
  <text class="col" x="60" y="575">created_at, updated_at</text>
  <text class="note" x="60" y="600">Unique(file_id, interval, case_name)</text>

  <!-- voice_phising_number_list -->
  <rect class="box" x="560" y="420" width="420" height="180" />
  <text class="title" x="580" y="450">voice_phising_number_list</text>
  <text class="col" x="580" y="475">PK id (UUID)</text>
  <text class="col" x="580" y="495">number (unique)</text>
  <text class="col" x="580" y="515">description</text>
  <text class="col" x="580" y="535">report_count</text>
  <text class="col" x="580" y="555">created_at, updated_at</text>
</svg>
